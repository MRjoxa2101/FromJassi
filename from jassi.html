<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>For Jassi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#000;--fg:#ffd6ea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#ffd6ea}}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
.controls{position:absolute;top:0;left:0;z-index:1}
canvas{position:absolute}
svg{position:absolute;display:none}
#t{position:absolute;left:0;right:0;bottom:5%;z-index:2;text-align:center;color:var(--fg);pointer-events:none;
 font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Math","Cambria Math",Georgia,serif;font-style:italic;
 font-size:clamp(28px,7vw,52px);letter-spacing:.04em;opacity:0;transform:translateY(14px);
 text-shadow:0 0 12px #ee5282,0 0 32px #ee5282;animation:in 2.4s ease-out 1.5s forwards,glow 3s ease-in-out 4s infinite}
@keyframes in{to{opacity:1;transform:none}}
@keyframes glow{50%{text-shadow:0 0 18px #ff7ab8,0 0 48px #ee5282}}
</style>
</head>
<body>

<svg viewBox="0 0 600 552">
  <path d="M300,107.77C284.68,55.67,239.76,0,162.31,0,64.83,0,0,82.08,0,171.71c0,.48,0,.95,0,1.43-.52,19.5,0,217.94,299.87,379.69v0l0,0,.05,0,0,0,0,0v0C600,391.08,600.48,192.64,600,173.14c0-.48,0-.95,0-1.43C600,82.08,535.17,0,437.69,0,360.24,0,315.32,55.67,300,107.77" fill="#ee5282"/>
</svg>

<div id="t">For 𝓙𝓪𝓼𝓼𝓲</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.136.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.136.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
/* SETUP */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.z = 500;

const renderer = new THREE.WebGLRenderer();
renderer.setPixelRatio(window.devicePixelRatio > 1 ? 2 : 1);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.insertBefore(renderer.domElement, document.body.firstChild);

/* CONTROLS */
const controlsWebGL = new THREE.OrbitControls(camera, renderer.domElement);

/* PARTICLES */
const tl = gsap.timeline({ repeat: -1, yoyo: true });

const path = document.querySelector("path");
const length = path.getTotalLength();
const vertices = [];
for (let i = 0; i < length; i += 0.1) {
  const point = path.getPointAtLength(i);
  const vector = new THREE.Vector3(point.x, -point.y, 0);
  vector.x += (Math.random() - 0.5) * 30;
  vector.y += (Math.random() - 0.5) * 30;
  vector.z += (Math.random() - 0.5) * 70;
  vertices.push(vector);
  tl.from(vector, {
    x: 600 / 2,
    y: -552 / 2,
    z: 0,
    ease: "power2.inOut",
    duration: "random(2, 5)"
  }, i * 0.002);
}
const geometry = new THREE.BufferGeometry().setFromPoints(vertices);
const material = new THREE.PointsMaterial({ color: 0xee5282, blending: THREE.AdditiveBlending, size: 3 });
const particles = new THREE.Points(geometry, material);
particles.position.x -= 600 / 2;
particles.position.y += 552 / 2;
scene.add(particles);

gsap.fromTo(scene.rotation, { y: -0.2 }, {
  y: 0.2, repeat: -1, yoyo: true, ease: "power2.inOut", duration: 3
});

/* RENDERING */
function render() {
  requestAnimationFrame(render);
  geometry.setFromPoints(vertices);
  renderer.render(scene, camera);
}

/* EVENTS */
function fitCamera() {
  // Tor (telefon) ekranlarda yurak sig'ishi uchun kamerani uzoqlashtiramiz
  if (camera.aspect < 0.9) camera.position.z = 500 * (0.9 / camera.aspect);
}
function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  fitCamera();
}
window.addEventListener("resize", onWindowResize, false);
fitCamera();

requestAnimationFrame(render);
</script>
</body>
</html>
